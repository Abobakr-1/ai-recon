[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recon"
version = "1.1.0"
description = "AI RECON - AI-system reconnaissance toolkit (OSAI Ch2 methodology) by AboBakr Mohamed, for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "PyYAML>=5.4"]

[project.scripts]
ai-recon = "airecon.cli:main"
airecon = "airecon.cli:main"

[tool.setuptools.packages.find]
include = ["airecon*"]
